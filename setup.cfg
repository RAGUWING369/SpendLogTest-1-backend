# ──────────────────────────────────────────────────────────────────────────────
# SpendLog Backend — Project Tool Configuration
# ──────────────────────────────────────────────────────────────────────────────
# This file configures pytest, isort, and flake8 for the backend codebase.
# Black formatter is configured in pyproject.toml (black does not read setup.cfg).
# All commands are referenced in the Definition of Done and CI pipeline.
# ──────────────────────────────────────────────────────────────────────────────

[tool:pytest]
# Test discovery root — all test files live under tests/
testpaths = tests
# asyncio_mode = auto: every async test function is treated as an async test
# automatically without the @pytest.mark.asyncio decorator (pytest-asyncio >= 0.21)
asyncio_mode = auto
# Strict marker mode — any unknown @pytest.mark.xxx raises an error
addopts = --strict-markers
# Treat all warnings as actionable but do not fail on DeprecationWarning from
# third-party libraries (SQLAlchemy, asyncpg, etc.)
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*:
    ignore::DeprecationWarning:asyncpg.*:
    ignore::PendingDeprecationWarning

[isort]
# Use the Black-compatible import ordering profile
profile = black
line_length = 88
# Ensure the app package is treated as first-party (not third-party)
known_first_party = app
# Multi-line output style 3 = Vertical Hanging Indent (Black-compatible)
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

[flake8]
# Align with Black's line length — Black reformats to 88 chars, flake8 must agree
max-line-length = 88
# E203: whitespace before ':' — conflicts with Black slice formatting
# W503: line break before binary operator — Black puts breaks before operators
extend-ignore = E203, W503
# Exclude generated, virtual-env, and IDE artefacts from linting
exclude =
    .venv,
    venv,
    .git,
    __pycache__,
    alembic/versions,
    build,
    dist,
    *.egg-info
# Allow bare F401 (imported but unused) only in __init__.py re-export files
per-file-ignores =
    __init__.py:F401
